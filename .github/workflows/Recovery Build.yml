name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated image as an experimental prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: t2s-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      DEVICE_PATH: device/samsung/exynos2100
      USE_CCACHE: "false"
      CCACHE_DISABLE: "1"

    steps:
      - name: Check out build configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Preflight recovery automation and overlay syntax
        run: |
          set -euo pipefail
          # Catch script/manifest errors before the expensive firmware and
          # Android source sync stages.
          python3 -m py_compile \
            scripts/t2s-source-audit.py \
            scripts/t2s-prune-unused-soong.py \
            scripts/t2s-prune-robolectric.py \
            scripts/t2s-disable-hidl-vts.py \
            scripts/stage-firmware.py \
            scripts/validate-t2s-recovery.py
          # Exercise the Robolectric parser against test-only and mixed
          # production/test Blueprints before the expensive repo sync.
          bash -n scripts/t2s-restore-vintf-host.sh
          python3 -m unittest discover -s tests -p 'test_t2s_prune_robolectric.py' -v
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse(".github/manifest/t2s.xml").getroot()
          assert root.tag == "manifest", "Invalid local repo manifest"
          PY

      - name: Download and verify private JHZA6 reference
        env:
          # Preferred: a single .img asset in the private release tagged jhza6-reference.
          # The read-only PAT must be restricted to faizsurprise/t2s-jhza6-private-.
          PRIVATE_RELEASE_TOKEN: ${{ secrets.JHZA6_PRIVATE_READ_TOKEN }}
          # Backwards-compatible alternative; must be a direct HTTPS download URL.
          FIRMWARE_URL: ${{ secrets.JHZA6_RECOVERY_URL }}
          FIRMWARE_SHA256: 31d3fd5882b57a3fb772991e56ce24c9df51fceb25240237844616b194d1faa7
        run: |
          set -euo pipefail
          reference="$RUNNER_TEMP/jhza6-reference.img"
          trap 'rm -f -- "$reference"' ERR

          if [[ -n "$PRIVATE_RELEASE_TOKEN" ]]; then
            echo "Downloading JHZA6 reference from private GitHub release."
            GH_TOKEN="$PRIVATE_RELEASE_TOKEN" gh release download jhza6-reference \
              --repo faizsurprise/t2s-jhza6-private- \
              --pattern '*.img' --output "$reference"
          elif [[ -n "$FIRMWARE_URL" ]]; then
            echo "Downloading JHZA6 reference from configured private HTTPS URL."
            curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' \
              --connect-timeout 30 --max-time 600 --max-redirs 5 \
              --max-filesize 67108864 \
              --output "$reference" --url "$FIRMWARE_URL"
          else
            echo "::error::Configure JHZA6_PRIVATE_READ_TOKEN for the private GitHub release, or JHZA6_RECOVERY_URL for direct HTTPS download."
            exit 1
          fi

          # The uploaded image must be the exact verified reference; never
          # silently substitute an arbitrary Samsung recovery image.
          printf '%s  %s\n' "$FIRMWARE_SHA256" "$reference" | sha256sum --check --strict

      - name: Prepare Ubuntu x86-64 and reclaim disk space
        run: |
          test "$(uname -m)" = x86_64
          df -h .
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo apt-get update -o APT::Update::Error-Mode=any
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex g++-multilib gcc-multilib gperf \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses-dev \
            libssl-dev libxml2-utils openssl python3 unzip xsltproc zip zlib1g-dev
          sudo apt-get clean
          df -h .

      - name: Set up the minimal TWRP 12.1 manifest
        run: |
          mkdir -p "$RUNNER_TEMP/bin" android-source
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/bin/repo" https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x "$RUNNER_TEMP/bin/repo"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          cd android-source
          "$RUNNER_TEMP/bin/repo" init --depth=1 --no-clone-bundle --no-use-superproject \
            --groups=default,-darwin \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          install -D "$GITHUB_WORKSPACE/.github/manifest/t2s.xml" .repo/local_manifests/t2s.xml
          # Freeze the base manifest at the SHA used by the previous runs.
          # Refuse silent upstream project-selection changes.
          expected_manifest=6dc117d9cbd08430daa16db2013560e1c4017fa8
          actual_manifest="$(git -C .repo/manifests rev-parse HEAD)"
          if [[ "$actual_manifest" != "$expected_manifest" ]]; then
            echo "::error::Upstream TWRP manifest moved to $actual_manifest; expected $expected_manifest. Review/pin the new manifest before retrying."
            exit 1
          fi

      - name: Sync and verify pinned sources
        working-directory: android-source
        run: |
          source "$GITHUB_WORKSPACE/scripts/t2s-disk.sh"
          check_disk_space "source sync"
          monitor_disk_space
          repo sync --current-branch --no-tags --no-clone-bundle --no-use-superproject --fail-fast -j2
          git -C .repo/manifests rev-parse HEAD
          # Expand the revision and path in each project shell.
          # shellcheck disable=SC2016
          repo forall -e "$DEVICE_PATH" bootable/recovery system/vold -c \
            'actual=$(git rev-parse HEAD) && printf "%s %s\n" "$REPO_PATH" "$actual" && test "$actual" = "$REPO_RREV"'
          # Minimal TWRP intentionally removes these AOSP projects, but
          # retained Soong module definitions refer to their defaults.
          test -f test/vts-testcase/fuzz/iface_fuzzer/Android.bp
          test -d packages/modules/NeuralNetworks
          grep -R --include='Android.bp' -F -q 'name: "vts_proto_fuzzer_default"' test/vts-testcase/fuzz
          grep -R --include='Android.bp' -F -q 'name: "neuralnetworks_utils_defaults"' packages/modules/NeuralNetworks
          echo "Restored VTS fuzz and NeuralNetworks Soong defaults verified."
          # NetworkStack was also excluded by the minimal manifest, while
          # Connectivity coverage blueprints require its real java_defaults.
          test -d packages/modules/NetworkStack
          grep -R --include='Android.bp' -F -q 'name: "libnetworkstackutilsjni_deps"' packages/modules/NetworkStack
          echo "NetworkStack libnetworkstackutilsjni_deps verified."
          # Full AOSP junit and hamcrest are excluded from the minimal base
          # manifest but required by apache-harmony's JDWP host tests.
          test -f external/junit/Android.bp
          grep -R --include='Android.bp' -F -q 'name: "junit"' external/junit
          grep -R --include='Android.bp' -F -q 'name: "junit-host"' external/junit
          grep -R --include='Android.bp' -F -q 'name: "hamcrest"' external/hamcrest
          echo "JUnit/hamcrest Soong definitions verified."
          # gRPC Java has no recovery target and requires host-only libraries
          # stripped by the minimal manifest. Ensure local project removal won.
          test ! -d external/grpc-grpc-java
          echo "Excluded gRPC Java source verified."
          # VTS host test projects are intentionally excluded; the fuzzing
          # definitions needed by retained blueprints stay checked separately.
          test ! -d test/vts
          test ! -d test/vts-testcase/hal
          echo "Excluded VTS host test projects verified."
          # Genuine audio_utils is required by frameworks/av's LVM effects.
          # A project-level source pin ensures this is not a fake stub.
          test -d system/media/audio_utils
          grep -F -q 'name: "libaudioutils"' system/media/audio_utils/Android.bp
          echo "Pinned system/media libaudioutils provider verified."
          # libaudioutils links against a real libspeexresampler provider.
          test -f external/speex/Android.bp
          grep -F -q 'name: "libspeexresampler"' external/speex/Android.bp
          echo "Pinned Speex resampler provider verified."

      - name: Audit effective recovery manifest and runtime providers
        working-directory: android-source
        run: |
          set -euo pipefail
          # Inspect the actual merged repo checkout, not a guessed dependency
          # list. Keep genuine runtime libraries and verified Samsung pins.
          repo manifest -o "$RUNNER_TEMP/t2s-effective-manifest.xml"
          python3 "$GITHUB_WORKSPACE/scripts/t2s-source-audit.py" \
            --source-root . \
            --manifest "$RUNNER_TEMP/t2s-effective-manifest.xml" \
            --manifest-sha "$(git -C .repo/manifests rev-parse HEAD)" \
            --report "$RUNNER_TEMP/t2s-source-audit.json"
          {
            echo "### Recovery-only manifest audit"
            echo '~~~json'
            cat "$RUNNER_TEMP/t2s-source-audit.json"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore pinned AOSP CTS Soong defaults
        working-directory: android-source
        run: |
          set -euo pipefail
          # The minimal recovery manifest excludes platform/cts. Retained
          # framework test Android.bp files still reference the real CTS
          # java_defaults. Fetch ONLY the original root Android.bp from the
          # same immutable Android 12.1 tag used by the base manifest.
          # This avoids syncing the full CTS test suite, its huge test tree,
          # and its unrelated transitive dependencies.
          mkdir -p cts
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --proto-redir '=https' \
            'https://android.googlesource.com/platform/cts/+/refs/tags/android-12.1.0_r4/Android.bp?format=TEXT' \
            | base64 --decode > cts/Android.bp
          test -s cts/Android.bp
          grep -F -q 'name: "cts_support_defaults"' cts/Android.bp
          grep -F -q 'name: "cts_defaults"' cts/Android.bp
          echo "AOSP CTS support defaults restored at Android 12.1.0 r4."

      - name: Apply port patches and stage JHZA6 components
        working-directory: android-source
        run: |
          patches="$GITHUB_WORKSPACE/patches/t2s"
          git -C "$DEVICE_PATH" apply --check "$patches/device.patch"
          git -C bootable/recovery apply --check "$patches/teamwin-recovery.patch"
          git -C system/vold apply --check "$patches/vold.patch"
          git -C "$DEVICE_PATH" apply "$patches/device.patch"
          git -C bootable/recovery apply "$patches/teamwin-recovery.patch"
          git -C system/vold apply "$patches/vold.patch"
          # The pinned hook enables missing dependencies and auto-applies a different recovery patch.
          rm -- "$DEVICE_PATH/vendorsetup.sh"
          reference="$RUNNER_TEMP/jhza6-reference.img"
          trap 'rm -f -- "$reference"' EXIT
          python3 "$GITHUB_WORKSPACE/scripts/stage-firmware.py" "$reference" "$DEVICE_PATH"
          # The pinned Samsung .ko files are ELF kernel modules placed in the
          # recovery ramdisk. The t2s BoardConfig explicitly enables AOSP's
          # compatibility exception for PRODUCT_COPY_FILES ELF checks.
          grep -Fxq 'BUILD_BROKEN_ELF_PREBUILT_PRODUCT_COPY_FILES := true' \
            "$DEVICE_PATH/t2s/BoardConfig.mk"
          python3 - "$DEVICE_PATH/t2s/jhza6-root/lib/modules" <<'PY'
          from pathlib import Path
          import sys
          module_root = Path(sys.argv[1])
          kernel_modules = sorted(module_root.glob("*.ko"))
          if not kernel_modules:
              raise SystemExit("No verified JHZA6 kernel modules were staged")
          for module in kernel_modules:
              if module.read_bytes()[:4] != b"\x7fELF":
                  raise SystemExit(f"Expected an ELF kernel module: {module}")
          print(f"Verified {len(kernel_modules)} staged JHZA6 ELF kernel modules.")
          PY

      - name: Exclude unused development, test and documentation Soong modules
        working-directory: android-source
        run: |
          set -euo pipefail
          # The trimmed manifest deliberately omits doclava and junit-host.
          # Remove only the known documentation/test Soong modules, preserving
          # the package and dx-doc-stubs definitions in the same Android.bp.
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = (
              ("dalvik/dx/src/Android.bp", "droiddoc_host", "dx-docs"),
              ("dalvik/dx/junit-tests/Android.bp", "java_test_host", "dx-tests"),
              ("art/tools/ahat/Android.bp", "droiddoc_host", "ahat-docs"),
              ("packages/providers/MediaProvider/errorprone/Android.bp",
               "java_plugin", "error_prone_mediaprovider"),
              ("packages/providers/MediaProvider/errorprone/Android.bp",
               "java_library_host", "error_prone_mediaprovider_lib"),
              ("packages/modules/adb/fastdeploy/Android.bp",
               "java_test_host", "FastDeployHostTests"),
              ("external/icu/tools/testing/test_harness/Android.bp",
               "java_test_host", "ICU4CTestRunner"),
              ("external/icu/tools/srcgen/currysrc/Android.bp",
               "java_library_host", "currysrc"),
          )
          header = re.compile(r"(?m)^([A-Za-z_][A-Za-z0-9_]*)[ \t]*\{")
          name = re.compile(r'(?m)^[ \t]*name:[ \t]*"([^"]+)"')

          for file_name, expected_type, expected_name in targets:
              path = Path(file_name)
              source = path.read_text(encoding="utf-8")
              declarations = [
                  match for match in header.finditer(source)
                  if match.group(1) == expected_type
              ]
              if len(declarations) != 1:
                  raise SystemExit(
                      f"Refusing unsafe edit of {path}: expected one "
                      f"{expected_type} declaration, found {len(declarations)}"
                  )

              match = declarations[0]
              opening = source.index("{", match.start(), match.end())
              depth = 0
              closing = None
              for index in range(opening, len(source)):
                  if source[index] == "{":
                      depth += 1
                  elif source[index] == "}":
                      depth -= 1
                      if depth == 0:
                          closing = index + 1
                          break
                      if depth < 0:
                          raise SystemExit(f"Unbalanced braces in {path}")
              if closing is None:
                  raise SystemExit(f"Unbalanced module block in {path}")

              block = source[match.start():closing]
              if name.findall(block) != [expected_name]:
                  raise SystemExit(
                      f"Refusing unsafe edit of {path}: {expected_name} "
                      f"is not the unique name in the target block"
                  )

              result = source[:match.start()] + source[closing:]
              remaining = name.findall(result)
              if expected_name in remaining:
                  raise SystemExit(
                      f"{expected_name} still appears as a module in {path}"
                  )
              if expected_name == "dx-docs" and "dx-doc-stubs" not in remaining:
                  raise SystemExit("The unrelated dx-doc-stubs module was lost")
              if expected_name == "ahat-docs":
                  if "ahat-docs-stubs" not in remaining or "ahat" not in remaining:
                      raise SystemExit("Unrelated AHAT stub or tool module was lost")
              if expected_name == "FastDeployHostTests":
                  if not {"deployagent_lib", "deployagent"}.issubset(remaining):
                      raise SystemExit("ADB FastDeploy production modules were lost")
              if expected_name == "currysrc":
                  if "currysrc_org.eclipse" not in remaining:
                      raise SystemExit("The unrelated ICU Java import was lost")
              path.write_text(result, encoding="utf-8")
              print(f"Excluded only {expected_name} ({expected_type}) from {path}")
          PY

      - name: Exclude unrelated host development and GSI tests
        working-directory: android-source
        run: |
          set -euo pipefail
          # Exclude only validated development tools and GSI test blueprints.
          # They reference jsilver, guava, and tradefed, all omitted by the
          # minimal recovery source manifest; none is a recovery runtime module.
          python3 "$GITHUB_WORKSPACE/scripts/t2s-prune-unused-soong.py" .

      - name: Disable generated HIDL VTS tests for recovery
        working-directory: android-source
        run: |
          set -euo pipefail
          # The source tree excludes test/vts-testcase/hal, while the stock
          # HIDL generator otherwise emits ~24 VTS driver/profiler modules
          # that require its VtsHalDriverDefaults/VtsHalProfilerDefaults.
          # Disable only VTS module generation, not production HALs.
          python3 "$GITHUB_WORKSPACE/scripts/t2s-disable-hidl-vts.py" .
          grep -F -q 'shouldGenerateVts := false' system/tools/hidl/build/hidl_interface.go

      - name: Exclude unused Robolectric tests from Soong
        working-directory: android-source
        run: |
          set -euo pipefail
          # ALLOW_MISSING_DEPENDENCIES permits missing unrelated modules,
          # but Android 12.1's Robolectric test builder unconditionally casts
          # a missing robolectric-android-all-prebuilts runtime and panics.
          # Exclude only android_robolectric_test modules across the tree.
          python3 "$GITHUB_WORKSPACE/scripts/t2s-prune-robolectric.py" .
          # Assert the exact failing SettingsLibRoboTests test was removed,
          # while the production Android.bp in the same directory remains.
          file=frameworks/base/packages/SettingsLib/tests/robotests/Android.bp
          test -f "$file"
          if grep -F -q 'name: "SettingsLibRoboTests"' "$file"; then
            echo "::error::SettingsLibRoboTests still present"
            exit 1
          fi
          grep -F -q 'name: "SettingsLibShell"' "$file"

      - name: Restore pinned VINTF host assembly provider
        working-directory: android-source
        run: |
          set -euo pipefail
          # assemble_vintf really links libvts_vintf_test_common even though
          # its provider resides in a VTS project excluded by the manifest.
          # Restore only its 3 original AOSP files at the same Android tag;
          # verify their Git blob hashes, not a dummy library or full test tree.
          bash "$GITHUB_WORKSPACE/scripts/t2s-restore-vintf-host.sh" "$PWD"

      - name: Maximize safe recovery ramdisk gzip compression
        working-directory: android-source
        run: |
          set -euo pipefail
          # Preserve the gzip ramdisk format used by the stock JHZA6 kernel,
          # while raising the lossless compression level from the default to 9.
          # TeamWin's same Makefile already invokes $(MINIGZIP) -9 for notices.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("build/make/core/Makefile")
          source = path.read_text(encoding="utf-8")
          baseline = "COMPRESSION_COMMAND := $(MINIGZIP)\n"
          if source.count(baseline) != 1 or "$(MINIGZIP) -9" not in source:
              raise SystemExit("Unexpected TeamWin gzip rule; refuse optimizer")
          path.write_text(
              source.replace(baseline, "COMPRESSION_COMMAND := $(MINIGZIP) -9\n", 1),
              encoding="utf-8",
          )
          print("Recovery CPIO remains gzip; maximum lossless gzip level 9.")
          PY
          config=device/samsung/exynos2100/t2s/BoardConfig.mk
          for setting in \
            'TW_EXCLUDE_NANO := true' \
            'TW_EXCLUDE_BASH := true' \
            'TW_EXTRA_LANGUAGES := false' \
            'TW_INCLUDE_NTFS_3G := false' \
            'TW_INCLUDE_REPACKTOOLS := false'; do
            grep -Fxq "$setting" "$config" || {
              echo "::error::Missing recovery-only size optimization: $setting"
              exit 1
            }
          done
          grep -Fxq 'TW_INCLUDE_CRYPTO := true' "$config"
          grep -Fxq 'TW_USES_VENDOR_LIBS := true' "$config"
          grep -Fxq 'BOARD_RECOVERYIMAGE_PARTITION_SIZE := 67108864' "$config"
          echo "Confirmed 64 MiB limit and essential crypto settings."

      - name: Build recovery target with target-scoped dependency enforcement
        working-directory: android-source
        run: |
          # Android 12.1 build/envsetup.sh references intentionally unset
          # variables (TOP, ZSH_VERSION, etc.). Bash nounset (-u) makes
          # that supported initialization abort before Soong can run.
          # Preserve exit-on-error and pipeline failure propagation.
          set -eo pipefail
          source "$GITHUB_WORKSPACE/scripts/t2s-disk.sh"
          check_disk_space "recovery compilation"
          monitor_disk_space
          # This minimal manifest intentionally omits hundreds of unrelated
          # platform/test modules. Soong's permissive graph mode allows their
          # undefined references; it does NOT suppress Ninja failures when
          # a module actually used by recoveryimage has missing dependencies.
          # Production providers are explicitly verified in the audit step.
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          check_product twrp_t2s
          lunch twrp_t2s-eng
          echo "Building recoveryimage; missing selected dependencies must fail."

          # Only the selected recovery target is compiled; don't use 'make'
          # without a target (that would build unrelated modules/tests).
          if mka recoveryimage -j2 2>&1 | tee "$RUNNER_TEMP/t2s-build.log"; then
            echo "Recovery target completed. Static image validation follows."
          else
            echo "::error::Recovery target failed; inspecting target-relevant errors."
            grep -E 'missing dependencies:|FAILED:|error:|fatal:|ninja: build stopped' \
              "$RUNNER_TEMP/t2s-build.log" \
              | tail -n 80 > "$RUNNER_TEMP/t2s-error-excerpt.txt" || true
            {
              echo "### Recovery build failure excerpt"
              echo '~~~text'
              cat "$RUNNER_TEMP/t2s-error-excerpt.txt"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Validate image and generate SHA-256
        working-directory: android-source
        run: |
          image=out/target/product/t2s/recovery.img
          python3 "$GITHUB_WORKSPACE/scripts/validate-t2s-recovery.py" \
            "$image" "$DEVICE_PATH/t2s" external/avb/avbtool.py | tee "$RUNNER_TEMP/t2s-image-checks.txt"
          cat "$RUNNER_TEMP/t2s-image-checks.txt" >> "$GITHUB_STEP_SUMMARY"
          cd "$(dirname "$image")"
          sha256sum recovery.img > recovery.img.sha256
          sha256sum --check --strict recovery.img.sha256

      - name: Publish experimental prerelease
        if: inputs.publish
        working-directory: android-source/out/target/product/t2s
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum --check --strict recovery.img.sha256
          notes="$RUNNER_TEMP/t2s-release-notes.md"
          {
            printf '%s\n\n' 'Experimental TWRP recovery for SM-G996B (t2s) and G996BXXSJHZA6.'
            printf '%s\n\n' 'Static validation only. Device boot, verified-boot acceptance, and decryption are untested.'
            cat "$RUNNER_TEMP/t2s-image-checks.txt"
          } > "$notes"
          gh release create "t2s-jhza6-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            recovery.img recovery.img.sha256 --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'Experimental TWRP 3.7.1 for SM-G996B / JHZA6' --notes-file "$notes"
